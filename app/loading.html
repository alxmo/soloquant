<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline';">
  <title>SOLOQUANT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      /* background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); */
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #e0f2fe;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .container { text-align: center; }
    .logo {
      font-size: 42px; font-weight: 700; letter-spacing: 4px;
      background-color: #94a3b8;
      background-size: 200% 100%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    .logo-img {
      width: 160px; height: auto;
      margin-bottom: 24px;
      animation: fadeIn 1s ease-in;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .subtitle { font-size: 15px; color: #94a3b8; margin-bottom: 40px; letter-spacing: 1px; }
    .spinner {
      width: 56px; height: 56px; margin: 0 auto 28px;
      border: 4px solid rgba(146, 152, 154, 0.15);
      border-top-color: #cdcdcd;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 14px; color: #3d4447; min-height: 20px; }
    .status .dot { display: inline-block; animation: blink 1.2s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .progress-bar {
      width: 320px; height: 4px; margin: 20px auto 0;
      background: rgba(56, 189, 248, 0.15); border-radius: 2px; overflow: hidden;
    }
    .progress-bar .fill {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 2px;
      transition: width 0.5s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="SOLOQUANT" class="logo-img">
  </div>
</body>
</html>
