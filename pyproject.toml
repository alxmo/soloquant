[project]
name = "ai-quant"
version = "0.5.0"
description = "AI 全自动美股量化交易系统 - 面向金融小白"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]
deep = ["torch>=2.2"]  # 深度学习模型支持 (LSTM)
cloud = [
    # 云端轻量依赖 (不含 torch/qlib 训练)
    "akshare>=1.14",
    "finnhub-python>=2.4.20",
    "pandas>=2.0,<3.0",
    "pyarrow>=15.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "alpaca-py>=0.30",
    "python-dotenv>=1.0",
    "schedule>=1.2",
    "loguru>=0.7",
    "streamlit>=1.35",
    "httpx>=0.27",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
local = [
    # 本地完整依赖 (含训练/GPU)
    "akshare>=1.14",
    "finnhub-python>=2.4.20",
    "pandas>=2.0,<3.0",
    "pyarrow>=15.0",
    "openpyxl>=3.1",
    "pyqlib>=0.9.6",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "torch>=2.2",
    "alpaca-py>=0.30",
    "python-dotenv>=1.0",
    "schedule>=1.2",
    "loguru>=0.7",
    "streamlit>=1.35",
    "httpx>=0.27",
    "pydantic>=2.5",
    "paramiko>=3.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest]
testpaths = ["tests"]
