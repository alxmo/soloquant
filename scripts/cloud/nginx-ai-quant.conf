# Nginx 反向代理配置 - AI量化系统
# 用法: 
#   sudo cp scripts/cloud/nginx-ai-quant.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/nginx-ai-quant.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ─── HTTP -> HTTPS 重定向 ───
server {
    listen 80;
    server_name your-domain.com;  # 替换为你的域名或IP

    # 可选: 申请Let's Encrypt证书后取消下面注释
    # return 301 https://$host$request_uri;
}

# ─── HTTPS 配置 ───
server {
    listen 80;
    # listen 443 ssl;  # 启用HTTPS时取消注释
    server_name your-domain.com;  # 替换为你的域名或IP

    # SSL 证书 (申请Let's Encrypt后配置)
    # ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # ─── 模型同步 API ───
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 文件上传大小限制 (模型文件)
        client_max_body_size 50M;
    }

    # ─── API 文档 (FastAPI Swagger) ───
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # ─── Dashboard (Streamlit) ───
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Streamlit WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
